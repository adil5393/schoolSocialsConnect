services:

  postgres:
    image: postgres:16-alpine
    container_name: schoolsocials-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  minio:
    image: minio/minio:latest
    container_name: schoolsocials-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9010:9000"
      - "9011:9001"

    volumes:
      - minio_data:/data


  backend:
    build:
      context: ./backend

    container_name: schoolsocials-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started


  frontend:
    build:
      context: ./frontend

    container_name: schoolsocials-frontend

    ports:
      - "5174:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost:8000

    depends_on:
      - postgres
      - minio
      - backend


volumes:
  postgres_data:
  minio_data: