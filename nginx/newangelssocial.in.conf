# nginx server block for newangelssocial.in (SchoolSocialsConnect)
#
# Assumes nginx runs directly on the host (not inside docker-compose), reverse-proxying to the
# ports docker-compose.yml already publishes to 127.0.0.1:
#   backend  -> 127.0.0.1:8000
#   minio    -> 127.0.0.1:9010 (API port; the 9011 console port is left host-only, not exposed here)
#
# The frontend is served by nginx directly as a static production build -- NOT the Vite dev
# server that docker-compose runs for local development. Build it and point `root` below at the
# output:
#   cd frontend && VITE_API_BASE_URL=https://newangelssocial.in/api npm run build
#   rsync -a frontend/dist/ /var/www/newangelssocial/frontend/dist/
#
# Matching .env changes needed before deploying (see .env.example-style comments already in .env):
#   CORS_ORIGINS=https://newangelssocial.in
#   MINIO_BROWSER_ENDPOINT=newangelssocial.in
#   MINIO_BROWSER_SECURE=true
#   PUBLIC_MEDIA_BASE_URL=https://newangelssocial.in
#
# TLS certs below assume certbot's standard layout, e.g.:
#   sudo certbot certonly --webroot -w /var/www/certbot -d newangelssocial.in -d www.newangelssocial.in

# Redirect plain HTTP -> HTTPS (but let certbot's ACME challenge through first).
server {
    listen 80;
    listen [::]:80;
    server_name newangelssocial.in www.newangelssocial.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://newangelssocial.in$request_uri;
    }
}

# www -> apex redirect over HTTPS.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.newangelssocial.in;

    ssl_certificate     /etc/letsencrypt/live/newangelssocial.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newangelssocial.in/privkey.pem;

    return 301 https://newangelssocial.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name newangelssocial.in;

    ssl_certificate     /etc/letsencrypt/live/newangelssocial.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newangelssocial.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allows video uploads through to the backend (Create Post's dropzone advertises up to 50MB).
    client_max_body_size 60M;

    # --- Backend API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Instagram's publish-now flow polls Meta for up to ~60s before responding.
        proxy_read_timeout 120s;
    }

    # --- Media storage (Minio), reachable at the bucket path directly ---
    # Presigned S3 URLs sign the Host header as part of the request signature, so it MUST be
    # forwarded unchanged (proxy_set_header Host $host) -- rewriting it here would make every
    # presigned media URL fail signature validation at Minio. The path below matches MINIO_BUCKET
    # in .env (school-socials-media by default); update both together if you rename the bucket.
    location /school-socials-media/ {
        proxy_pass http://127.0.0.1:9010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend (static production build) ---
    root /var/www/newangelssocial/frontend/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React Router client-side routing: fall back to index.html for any non-file, non-API route.
    location / {
        try_files $uri /index.html;
    }
}
